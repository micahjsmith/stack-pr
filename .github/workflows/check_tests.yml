name: Check Tests
on: [ pull_request ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # rich is optional at runtime; install it so the tests that cover the
      # rich rendering path run too.
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra rich
      - name: Run tests
        run: uv run --no-sync pytest tests/

  vscode:
    # The VS Code extension has its own (node) tests: grammar assertions in
    # editors/vscode/tests/*.autoland-plan, formatter tests in *.test.js.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '20'
      - name: Run extension tests
        working-directory: editors/vscode
        run: npm test

name: Lint and check
on: [ pull_request ]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # Run the ruff version pinned in uv.lock, so CI matches local runs.
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run ruff linter
        run: uv run --no-sync ruff check
      - name: Run ruff format
        run: uv run --no-sync ruff format --check

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      # rich is optional at runtime, but install it so autoland's optional
      # import is type checked.
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra rich
      - name: Run mypy
        run: uv run --no-sync mypy src
